name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # paramiko 必须 3.5.x（老设备 ssh-rsa 支持），其余为可选能力依赖
          python -m pip install pyinstaller "paramiko==3.5.1" pyyaml openpyxl
      - name: Build V3 (base)
        run: python -m PyInstaller --clean --noconfirm NetworkInspectionV3.spec
      - name: Build V5 (with Ring Alert)
        working-directory: v5
        run: python -m PyInstaller --clean --noconfirm NetworkInspectionV5.spec
      - name: Upload V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInspection-V3-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: Upload V5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInspection-V5-exe
          path: v5/dist/*.exe
          if-no-files-found: error
