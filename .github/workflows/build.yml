name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "paramiko==3.5.1" pyyaml openpyxl
      - name: Build V6 (studio)
        run: python -m PyInstaller --clean --noconfirm NetworkInspectionV6.spec
      - name: Build V5 (legacy)
        working-directory: v5
        run: python -m PyInstaller --clean --noconfirm NetworkInspectionV5.spec
      - name: Upload V6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInspection-Studio-V6-exe
          path: dist/*.exe
          if-no-files-found: error
      - name: Upload V5 legacy artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInspection-V5-legacy-exe
          path: v5/dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe.FullName --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $exe.FullName --title "Network Inspection Studio $env:GITHUB_REF_NAME" --generate-notes
          }
